[package]
name = "appletv-launcher"
version = "1.0.0"
description = "Apple TV (tvOS) style home screen launcher"
authors = ["mango"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "appletv_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Generates `src/generated.ts` (the TypeScript wire types) from the Rust
# structs — see the `export_typescript` test in src-tauri/src/lib.rs.
ts-rs = "12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
